<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حجز المواعيد | Appointment Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7' }
          }
        }
      }
    }
  </script>
  <style>
    .time-slot.available { @apply border-sky-200 bg-sky-50 text-sky-700 hover:bg-sky-100; }
    .time-slot.selected { @apply border-sky-500 bg-sky-500 text-white; }
    .time-slot.booked { @apply border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="app"></div>

  <script>
    const translations = {
      ar: {
        title: "حجز المواعيد",
        subtitle: "احجز موعدك بسهولة في العيادة أو الصالون",
        selectService: "اختر الخدمة",
        selectDate: "اختر التاريخ",
        selectTime: "اختر الوقت",
        yourInfo: "معلوماتك",
        name: "الاسم الكامل",
        phone: "رقم الهاتف",
        email: "البريد الإلكتروني",
        notes: "ملاحظات (اختياري)",
        bookNow: "تأكيد الحجز",
        success: "تم الحجز بنجاح!",
        successMsg: "شكراً لك، تم تأكيد موعدك.",
        bookAnother: "حجز موعد آخر",
        viewBookings: "عرض الحجوزات",
        noSlots: "لا توجد أوقات متاحة لهذا اليوم",
        services: [
          { id: "haircut", name: "قص شعر", duration: "30 دقيقة", price: "50 ر.س" },
          { id: "color", name: "صبغة شعر", duration: "90 دقيقة", price: "150 ر.س" },
          { id: "consult", name: "استشارة طبية", duration: "20 دقيقة", price: "100 ر.س" },
          { id: "facial", name: "عناية بالبشرة", duration: "45 دقيقة", price: "120 ر.س" },
          { id: "manicure", name: "مانيكير", duration: "40 دقيقة", price: "80 ر.س" },
        ],
        adminTitle: "الحجوزات",
        noBookings: "لا توجد حجوزات بعد",
        back: "العودة",
        delete: "حذف",
        service: "الخدمة",
        date: "التاريخ",
        time: "الوقت",
        customer: "العميل",
        langBtn: "English"
      },
      en: {
        title: "Appointment Booking",
        subtitle: "Book your appointment easily at the clinic or salon",
        selectService: "Select Service",
        selectDate: "Select Date",
        selectTime: "Select Time",
        yourInfo: "Your Information",
        name: "Full Name",
        phone: "Phone Number",
        email: "Email",
        notes: "Notes (optional)",
        bookNow: "Confirm Booking",
        success: "Booking Confirmed!",
        successMsg: "Thank you, your appointment has been confirmed.",
        bookAnother: "Book Another",
        viewBookings: "View Bookings",
        noSlots: "No available slots for this day",
        services: [
          { id: "haircut", name: "Haircut", duration: "30 min", price: "50 SAR" },
          { id: "color", name: "Hair Coloring", duration: "90 min", price: "150 SAR" },
          { id: "consult", name: "Medical Consultation", duration: "20 min", price: "100 SAR" },
          { id: "facial", name: "Facial Care", duration: "45 min", price: "120 SAR" },
          { id: "manicure", name: "Manicure", duration: "40 min", price: "80 SAR" },
        ],
        adminTitle: "Bookings",
        noBookings: "No bookings yet",
        back: "Back",
        delete: "Delete",
        service: "Service",
        date: "Date",
        time: "Time",
        customer: "Customer",
        langBtn: "العربية"
      }
    };

    const TIME_SLOTS = [
      "09:00","09:30","10:00","10:30","11:00","11:30",
      "12:00","12:30","13:00","13:30","14:00","14:30",
      "15:00","15:30","16:00","16:30","17:00","17:30"
    ];

    let state = {
      lang: "ar",
      step: "form",
      service: "",
      date: new Date().toISOString().split("T")[0],
      time: "",
      name: "",
      phone: "",
      email: "",
      notes: "",
      bookings: JSON.parse(localStorage.getItem("bookings") || "[]")
    };

    function t() { return translations[state.lang]; }
    function isRTL() { return state.lang === "ar"; }

    function getBookedSlots() {
      return state.bookings.filter(b => b.date === state.date).map(b => b.time);
    }

    function getServiceName(id) {
      return t().services.find(s => s.id === id)?.name || id;
    }

    function saveBookings() {
      localStorage.setItem("bookings", JSON.stringify(state.bookings));
    }

    function render() {
      const root = document.getElementById("app");
      document.documentElement.lang = state.lang;
      document.documentElement.dir = isRTL() ? "rtl" : "ltr";

      if (state.step === "success") {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 max-w-md w-full text-center space-y-6">
              <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <h2 class="text-2xl font-bold">${t().success}</h2>
              <p class="text-slate-600">${t().successMsg}</p>
              <div class="bg-slate-50 rounded-xl p-4 text-sm text-start space-y-2">
                <p><span class="text-slate-500">${t().service}:</span> ${getServiceName(state.service)}</p>
                <p><span class="text-slate-500">${t().date}:</span> ${state.date}</p>
                <p><span class="text-slate-500">${t().time}:</span> ${state.time}</p>
                <p><span class="text-slate-500">${t().customer}:</span> ${state.name}</p>
              </div>
              <div class="flex flex-col gap-3">
                <button onclick="resetForm()" class="bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 px-5 rounded-xl w-full">${t().bookAnother}</button>
                <button onclick="setStep('admin')" class="bg-white hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-5 rounded-xl border border-slate-200 w-full">${t().viewBookings}</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.step === "admin") {
        const list = state.bookings.length === 0
          ? `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-12 text-center text-slate-500">${t().noBookings}</div>`
          : state.bookings.slice().reverse().map(b => `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="space-y-1">
                  <p class="font-semibold">${getServiceName(b.service)}</p>
                  <p class="text-sm text-slate-600">${b.date} • ${b.time}</p>
                  <p class="text-sm text-slate-500">${b.name} • ${b.phone}</p>
                  ${b.email ? `<p class="text-sm text-slate-400">${b.email}</p>` : ""}
                  ${b.notes ? `<p class="text-sm text-slate-400 italic">${b.notes}</p>` : ""}
                </div>
                <button onclick="deleteBooking('${b.id}')" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1.5 rounded-lg hover:bg-red-50">${t().delete}</button>
              </div>
            `).join("");

        root.innerHTML = `
          <div class="min-h-screen p-4 md:p-8">
            <div class="max-w-3xl mx-auto">
              <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">${t().adminTitle}</h1>
                <button onclick="setStep('form')" class="bg-white hover:bg-slate-50 text-slate-700 font-medium py-2 px-4 rounded-xl border border-slate-200">${t().back}</button>
              </div>
              <div class="space-y-3">${list}</div>
            </div>
          </div>
        `;
        return;
      }

      // Form
      const booked = getBookedSlots();
      const servicesHtml = t().services.map(s => `
        <button type="button" onclick="setService('${s.id}')"
          class="p-4 rounded-xl border-2 text-start transition-all ${state.service === s.id ? 'border-sky-500 bg-sky-50' : 'border-slate-100 hover:border-slate-200 bg-white'}">
          <p class="font-medium">${s.name}</p>
          <p class="text-sm text-slate-500 mt-1">${s.duration} • ${s.price}</p>
        </button>
      `).join("");

      const timesHtml = TIME_SLOTS.map(slot => {
        const isBooked = booked.includes(slot);
        const isSelected = state.time === slot;
        let cls = "px-3 py-2 rounded-lg border text-sm font-medium transition-all ";
        if (isBooked) cls += "border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed";
        else if (isSelected) cls += "border-sky-500 bg-sky-500 text-white";
        else cls += "border-sky-200 bg-sky-50 text-sky-700 hover:bg-sky-100 cursor-pointer";
        return `<button type="button" ${isBooked ? "disabled" : `onclick="setTime('${slot}')"`} class="${cls}">${slot}</button>`;
      }).join("");

      const today = new Date().toISOString().split("T")[0];
      const maxDate = new Date(); maxDate.setDate(maxDate.getDate() + 30);
      const max = maxDate.toISOString().split("T")[0];

      root.innerHTML = `
        <header class="bg-white border-b border-slate-100 sticky top-0 z-10">
          <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
              <h1 class="text-xl font-bold">${t().title}</h1>
              <p class="text-sm text-slate-500 hidden sm:block">${t().subtitle}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleLang()" class="bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium py-1.5 px-3 rounded-xl border border-slate-200">${t().langBtn}</button>
              <button onclick="setStep('admin')" class="bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium py-1.5 px-3 rounded-xl border border-slate-200">${t().viewBookings}</button>
            </div>
          </div>
        </header>

        <main class="max-w-2xl mx-auto px-4 py-8">
          <form onsubmit="handleSubmit(event)" class="space-y-8">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 class="text-lg font-semibold mb-4">${t().selectService}</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${servicesHtml}</div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 class="text-lg font-semibold mb-4">${t().selectDate}</h2>
              <input type="date" value="${state.date}" min="${today}" max="${max}"
                onchange="setDate(this.value)"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400" required />
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 class="text-lg font-semibold mb-4">${t().selectTime}</h2>
              <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">${timesHtml}</div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
              <h2 class="text-lg font-semibold mb-4">${t().yourInfo}</h2>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-slate-600 mb-1.5">${t().name} <span class="text-red-400">*</span></label>
                  <input type="text" value="${state.name}" oninput="state.name=this.value" required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400"
                    placeholder="${isRTL() ? 'مثال: أحمد محمد' : 'e.g. John Doe'}" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-600 mb-1.5">${t().phone} <span class="text-red-400">*</span></label>
                  <input type="tel" value="${state.phone}" oninput="state.phone=this.value" required dir="ltr"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400"
                    placeholder="${isRTL() ? '05xxxxxxxx' : '+966 5x xxx xxxx'}" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-600 mb-1.5">${t().email}</label>
                  <input type="email" value="${state.email}" oninput="state.email=this.value" dir="ltr"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400"
                    placeholder="email@example.com" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-600 mb-1.5">${t().notes}</label>
                  <textarea oninput="state.notes=this.value" rows="3"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400 resize-none"
                    placeholder="${isRTL() ? 'أي ملاحظات إضافية...' : 'Any additional notes...'}">${state.notes}</textarea>
                </div>
              </div>
            </section>

            <button type="submit" ${(!state.service || !state.date || !state.time || !state.name || !state.phone) ? "disabled" : ""}
              class="bg-sky-500 hover:bg-sky-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium text-lg py-3.5 px-5 rounded-xl w-full shadow-sm">
              ${t().bookNow}
            </button>
          </form>
        </main>

        <footer class="text-center text-sm text-slate-400 py-6">
          © ${new Date().getFullYear()} Booking App
        </footer>
      `;
    }

    function setService(id) { state.service = id; render(); }
    function setDate(val) { state.date = val; state.time = ""; render(); }
    function setTime(val) { state.time = val; render(); }
    function setStep(s) { state.step = s; render(); }
    function toggleLang() { state.lang = state.lang === "ar" ? "en" : "ar"; render(); }

    function resetForm() {
      state.service = "";
      state.date = new Date().toISOString().split("T")[0];
      state.time = "";
      state.name = "";
      state.phone = "";
      state.email = "";
      state.notes = "";
      state.step = "form";
      render();
    }

    function handleSubmit(e) {
      e.preventDefault();
      if (!state.service || !state.date || !state.time || !state.name || !state.phone) return;
      const booking = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        service: state.service,
        date: state.date,
        time: state.time,
        name: state.name,
        phone: state.phone,
        email: state.email,
        notes: state.notes,
        createdAt: new Date().toISOString()
      };
      state.bookings.push(booking);
      saveBookings();
      state.step = "success";
      render();
    }

    function deleteBooking(id) {
      state.bookings = state.bookings.filter(b => b.id !== id);
      saveBookings();
      render();
    }

    render();
  </script>
</body>
</html>
